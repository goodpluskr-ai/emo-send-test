name: 시험 앱 APK 만들기

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: APK 빌드
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: emo-send-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: 휴대폰용 다운로드 페이지 갱신
        if: github.ref == 'refs/heads/main'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk emo-send-test.apk
          gh release delete test-latest --yes --cleanup-tag || true
          gh release create test-latest emo-send-test.apk \
            --title "이모 전송 시험 앱 (최신)" \
            --notes "휴대폰에서 emo-send-test.apk 를 눌러 내려받고 설치하세요. (빌드: ${{ github.sha }})"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
